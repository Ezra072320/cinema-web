worker_processes auto;
worker_rlimit_nofile 200000;
events { worker_connections 65535; multi_accept on; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 20s;
  client_body_timeout 10s;
  client_header_timeout 10s;
  client_max_body_size 12m;
  # A node admits a finite number of upstream requests; excess traffic receives 429.
  limit_req_zone $server_name zone=api_cluster:10m rate=3000r/s;
  limit_req_zone $binary_remote_addr zone=per_ip:20m rate=30r/s;
  limit_conn_zone $server_name zone=connections:1m;
  limit_req_status 429;
  limit_conn_status 429;
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream cinema_gateway {
    zone cinema_gateway 64k;
    server gateway:8080 resolve;
    keepalive 128;
  }
  server {
    listen 80 backlog=65535;
    root /usr/share/nginx/html;
    limit_conn connections 50000;
    error_page 429 = @busy;
    location @busy {
      default_type application/json;
      add_header Retry-After 2 always;
      return 429 '{"code":3001,"msg":"访问人数较多，请稍后重试"}';
    }
    location /api/ {
      limit_req zone=api_cluster burst=1000 nodelay;
      limit_req zone=per_ip burst=60 nodelay;
      proxy_pass http://cinema_gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Service-Key "";
      proxy_set_header X-Operation-Id "";
      proxy_connect_timeout 1s;
      proxy_read_timeout 125s;
      proxy_send_timeout 10s;
      proxy_buffering off;
      # Writes are never replayed against another instance after an uncertain response.
      proxy_next_upstream off;
    }
    location /assets/ { expires 1y; add_header Cache-Control 'public, immutable'; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
